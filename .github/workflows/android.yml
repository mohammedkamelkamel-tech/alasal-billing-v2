name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Generate debug keystore
        shell: bash
        run: |
          set -e
          # signingConfigs.create("debugConfig") في app/build.gradle.kts هو إعداد توقيع مخصص،
          # وآلية AGP لإنشاء ~/.android/debug.keystore تلقائيًا تعمل فقط مع إعداد التوقيع
          # الافتراضي المسمى حرفيًا "debug"، لذلك يجب توليد المفتاح يدويًا هنا.
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          ls -lah app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricityBillingAp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
